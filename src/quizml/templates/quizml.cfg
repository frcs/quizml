# QuizML configuration
# Use spaces for indentation; tabs are not valid YAML indentation.

# Template and schema resources are resolved using QuizML's configured search
# paths. Replace these values to use your own schema or statistics template.
schema_path: schema.json
stats_template: stats.txt.j2

# Targets to compile when no --target is specified. If omitted, QuizML selects
# every render target. Targets with build_cmd are skipped unless selected.
# Example:
# default_targets:
#   - bb
#   - html-preview

# Named groups of targets, selectable with --target. A group can include other
# aliases. Add or edit groups to define workflows for your project.
aliases:
  build:
    - bb
    - html-preview
    - latex
    - latex-solutions
    - pdf
    - pdf-solutions

# Each target defines one output. Targets can be added, removed, or customized.
targets:
  # Blackboard import file. The postprocessor prepares HTML fragments for
  # Blackboard; remove it for outputs that need standard HTML.
  - name: bb
    descr: Blackboard test
    out: ${inputbasename}.txt
    descr_cmd: ${inputbasename}.txt
    markdown:
      format: html
      math: svg
      html_postprocess: blackboard_html
    html_pre: math-preamble.tex
    html_css: markdown-html.css
    template: blackboard.txt.j2

  # HTML preview of the quiz, useful for checking the rendered questions.
  - name: html-preview
    descr: HTML preview
    out: ${inputbasename}.html
    descr_cmd: ${inputbasename}.html
    markdown:
      format: html
      math: svg
    html_pre: math-preamble.tex
    html_css: markdown-html.css
    template: preview.html.j2

  # LaTeX source. The pdf target below depends on this output.
  - name: latex
    descr: LaTeX
    out: ${inputbasename}.tex
    descr_cmd: latexmk -xelatex -pvc ${inputbasename}.tex
    markdown:
      format: latex
    template: tcd-exam.tex.j2

  # LaTeX source with answers. The pdf-solutions target depends on this output.
  - name: latex-solutions
    descr: LaTeX solutions
    out: ${inputbasename}.solutions.tex
    descr_cmd: latexmk -xelatex -pvc ${inputbasename}.solutions.tex
    markdown:
      format: latex
    template: tcd-exam-solutions.tex.j2

  # Build commands run from the input YAML's directory. Selecting this target
  # also selects its LaTeX dependency; latexmk creates the PDF from that source.
  - name: pdf
    descr: LaTeX PDF
    out: ${inputbasename}.pdf
    dep: latex
    descr_cmd: ${inputbasename}.pdf
    build_cmd: latexmk -xelatex -interaction=nonstopmode ${inputbasename}.tex
    # Extra files to remove with this target's output when running quizml clean.
    clean_extensions:
      - .aux
      - .log
      - .out
      - .fls
      - .fdb_latexmk
      - .synctex.gz
      - .toc
      - .nav
      - .snm
      - .vrb
      - .bbl
      - .blg
      - .dvi
      - .xdv

  # PDF containing solutions, built from the solutions LaTeX source above.
  - name: pdf-solutions
    descr: LaTeX solutions PDF
    out: ${inputbasename}.solutions.pdf
    dep: latex-solutions
    descr_cmd: ${inputbasename}.solutions.pdf
    build_cmd: latexmk -xelatex -interaction=nonstopmode ${inputbasename}.solutions.tex
    clean_extensions:
      - .aux
      - .log
      - .out
      - .fls
      - .fdb_latexmk
      - .synctex.gz
      - .toc
      - .nav
      - .snm
      - .vrb
      - .bbl
      - .blg
      - .dvi
      - .xdv

  # Target #7 -- TCD Word Exam Paper
  - name: docx
    descr: TCD Word Exam Paper
    out: ${inputbasename}.docx
    descr_cmd: ${inputbasename}.docx
    fmt: docx
    template: tcd-exam.docx

  # Target #8 -- TCD Word Exam Paper (Solutions)
  - name: docx-solutions
    descr: TCD Word Exam Paper (Solutions)
    out: ${inputbasename}.solutions.docx
    dep: docx
    descr_cmd: ${inputbasename}.solutions.docx
    fmt: docx
    template: tcd-exam.docx
    context:
      solutions: true

  # Target #9 -- IMS QTI 1.2 Package (Canvas, Moodle, Brightspace)
  - name: qti
    descr: IMS QTI 1.2 Package (Canvas)
    out: ${inputbasename}.qti.zip
    descr_cmd: ${inputbasename}.qti.zip
    markdown:
      format: html
      math: mathml
    template: qti12

  - name: qti12
    descr: IMS QTI 1.2 Package (Canvas)
    out: ${inputbasename}.qti12.zip
    descr_cmd: ${inputbasename}.qti12.zip
    markdown:
      format: html
      math: mathml
    template: qti12

  # Target #10 -- IMS QTI 2.1 Package (Blackboard Ultra Question Banks)
  - name: qti21
    descr: IMS QTI 2.1 Package (Blackboard Ultra)
    out: ${inputbasename}.qti21.zip
    descr_cmd: ${inputbasename}.qti21.zip
    markdown:
      format: html
      math: mathml
    template: qti21

  # Target #11 -- Moodle XML Quiz (Moodle Question Bank)
  - name: moodle
    descr: Moodle XML Quiz
    out: ${inputbasename}.xml
    descr_cmd: ${inputbasename}.xml
    markdown:
      format: html
      math: mathml
    template: moodle.xml.j2
